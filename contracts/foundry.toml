[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
# F1a asks for 1000; after the G1 fixes (tuneLane, fault-isolated batches) the Arena is 24.8 kB at 1000 runs and
# 23.4 kB at 800 (via-IR inlining threshold). 800 keeps >1 kB of EIP-170 headroom at a negligible gas cost.
optimizer_runs = 800
# BnbPlayArena is ~30 kB with the legacy pipeline; via-IR is required to stay under EIP-170 (24,576 B).
via_ir = true
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
  "forge-std/=dependencies/forge-std-1.16.2/src/",
]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./config" },
  { access = "read", path = "../packages/shared/vectors" },
  { access = "read", path = "../research/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
forge-std = "1"
"@openzeppelin-contracts" = "5.7.0"
